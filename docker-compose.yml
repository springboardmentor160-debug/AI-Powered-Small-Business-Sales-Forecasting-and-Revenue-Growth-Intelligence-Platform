# Run the whole platform locally:  docker compose up --build
#   Frontend  http://localhost:8080
#   API docs  http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketmind_dev}
      POSTGRES_DB: marketmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind -d marketmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://marketmind:${POSTGRES_PASSWORD:-marketmind_dev}@db:5432/marketmind
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file next to docker-compose.yml}
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@marketmind.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in a .env file}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend/react-app
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
