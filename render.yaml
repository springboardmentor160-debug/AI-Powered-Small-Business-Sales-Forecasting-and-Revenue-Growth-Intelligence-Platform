# Render Blueprint: New + > Blueprint > select this repo.
# After the first deploy, fill in the three "sync: false" values (see docs/deployment.md).
databases:
  - name: marketmind-db
    plan: free
    databaseName: marketmind

services:
  - type: web
    name: marketmind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://marketmind-web.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: marketmind-web
    runtime: static
    rootDir: frontend/react-app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://marketmind-api.onrender.com
